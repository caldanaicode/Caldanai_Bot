			{% extends "layout.html" %}
			{% block content %}
			<table>
				<tr>
				{% for header in headers %}
					<th>{{ header }}</th>
				{% endfor %}
				</tr>
				{% for entry in entries %}
				<tr>
					{% for col in entry %}
					<td>
					{% if col | length > 80 %}
						<textarea rows="3" cols="80" readonly>{{ col }}</textarea>
					{% else  %}
						{{ col }}
					{% endif %}
					</td>
					{% endfor %}
				</tr>
				{% endfor %}
			{% endblock %}
			</table>
