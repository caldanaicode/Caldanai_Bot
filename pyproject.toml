[tool.black]
line-length = 120
target-version = ['py310']

[tool.isort]
profile = "black"

[project]
name = "caldanai-bot"
version = "0.1.0"
description = ""
authors = [
    {name = "caldanaicode",email = "1937752+caldanaicode@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["discord-py (>=2.5.0,<3.0.0)", "discord-ext-menus (>=1.1,<2.0)", "pymongo (>=4.11.1,<5.0.0)", "python-dotenv (>=1.0.1,<2.0.0)", "pandas (>=2.2.3,<3.0.0)", "matplotlib (>=3.10.0,<4.0.0)"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.optional-dependencies]
dev = ["pytest (>=8.0.0,<9.0.0)", "pytest-asyncio (>=0.24.0,<1.0.0)"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
